# Configuración de rustfmt para Fractal

# Usar la edición 2024 de Rust
edition = "2024"

# Ancho máximo de línea
max_width = 100

# Espacios por tabulación
tab_spaces = 4

# Formato de cadenas
use_small_heuristics = "Max"

# Ordenar importaciones automáticamente
reorder_imports = true
reorder_modules = true
