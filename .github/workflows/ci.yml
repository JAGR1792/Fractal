name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Verificar formato de código Rust (workspace raíz)
  fmt:
    name: Formato (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verificar formato
        run: cargo fmt --all -- --check

  # Linter de Rust (todos los crates del workspace)
  clippy:
    name: Linter (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Ejecutar clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Tests unitarios e integración (workspace completo)
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Ejecutar tests
        run: cargo test --workspace --all-features

  # Verificar que la documentación compila
  docs:
    name: Documentación (cargo doc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verificar documentación
        run: cargo doc --no-deps --workspace --all-features

  # Verificar que el proyecto compila en release
  release-build:
    name: Compilación release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilar release
        run: cargo build --workspace --release

  # Verificar TypeScript del frontend (ULTRA/LITE, sin motores)
  web-tipos:
    name: Web (tsc --noEmit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aplicaciones/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar TypeScript
        run: npm install --no-save typescript
      - name: Verificar tipos
        run: npx tsc --noEmit --skipLibCheck
