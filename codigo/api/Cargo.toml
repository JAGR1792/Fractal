[package]
name = "fractal-api"
version = "0.1.0"
edition = "2024"
description = "Servidor Axum para Fractal — Etapa 3: simulaciones N-cuerpos en background"
license = "MIT"

[[bin]]
name = "fractal-api"
path = "src/main.rs"

[lib]
name = "fractal_api"
path = "src/lib.rs"

[dependencies]
fractal-fisica = { path = "../fisica" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum-test = "15"
