[package]
name = "fractal-fisica"
version = "0.1.0"
edition = "2024"
description = "Motor gravitacional N-cuerpos para Fractal — educativo, probado, sin dependencias"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "rendimiento"
harness = false
