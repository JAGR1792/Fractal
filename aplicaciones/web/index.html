<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%232a2a5a'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%237DE2FC'/%3E%3C/svg%3E" />
    <title>Fractal — Simulador orbital</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a18; color: #eee; font-family: sans-serif; }
      #app { display: flex; flex-direction: column; height: 100vh; }
      #barra { display: flex; gap: 10px; padding: 6px 12px; align-items: center; background: rgba(18, 18, 42, 0.92); font-size: 13px; }
      #barra button { background: #2a2a5a; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 5px 10px; cursor: pointer; }
      #barra button:hover { background: #3a3a7a; }
      #btnPausa { min-width: 86px; }
      #vel { width: 90px; accent-color: #7DE2FC; }
      #tiempo { color: #7DE2FC; font-variant-numeric: tabular-nums; min-width: 86px; }
      #perfil { color: #999; font-size: 12px; }
      #sandbox {
        position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 10;
        display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; justify-content: center;
        background: rgba(14, 14, 34, 0.92); backdrop-filter: blur(8px);
        border: 1px solid #33335a; border-radius: 14px; padding: 10px 16px;
        font-size: 12px; transition: transform 0.25s ease, opacity 0.25s ease;
        max-width: calc(100vw - 24px);
      }
      #sandbox.cerrado { transform: translate(-50%, 150%); opacity: 0; pointer-events: none; }
      #sandbox .grupo { display: flex; flex-direction: column; gap: 4px; }
      #sandbox .titulo { color: #7DE2FC; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
      #sandbox .fila { display: flex; gap: 6px; align-items: center; }
      #sandbox input[type=range] { width: 96px; accent-color: #7DE2FC; }
      #sandbox input[type=number], #sandbox select {
        width: 88px; background: #1a1a3a; color: #eee; font-size: 12px;
        border: 1px solid #555; border-radius: 6px; padding: 3px 6px;
      }
      #sandbox select { width: auto; max-width: 110px; }
      #sbLanzar { background: #1a5a2a; color: #fff; border: 1px solid #555; border-radius: 8px; padding: 7px 14px; cursor: pointer; }
      #sbLanzar:hover { background: #237a37; }
      #sbEstado { color: #8fd08f; font-size: 12px; min-height: 14px; }
      #escena { flex: 1; width: 100%; min-height: 300px; touch-action: none; }
      #aviso { padding: 6px 12px; font-size: 13px; color: #ffb; }
      table { border-collapse: collapse; font-size: 13px; margin: 8px 12px; }
      td, th { border: 1px solid #444; padding: 4px 8px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="barra">
        <strong>Fractal</strong>
        <button id="btnPausa">Pausar</button>
        <label>Velocidad <input id="vel" type="range" min="0.1" max="10" step="0.1" value="1" /></label>
        <span id="tiempo" title="Tiempo simulado">—</span>
        <span id="perfil"></span>
        <button id="btnSandbox" title="Mostrar/ocultar panel sandbox">Sandbox</button>
      </div>
      <div id="sandbox" aria-label="Panel sandbox: edita parámetros y lanza simulaciones"></div>
      <canvas id="escena" tabindex="0" aria-label="Vista 3D del sistema solar. Flechas rotan, más y menos acercan, R resetea."></canvas>
      <div id="aviso" role="status"></div>
      <table id="tabla" aria-label="Datos tabulares de cuerpos (alternativa accesible)"></table>
    </div>
    <script type="module" src="/src/principal.ts"></script>
  </body>
</html>
